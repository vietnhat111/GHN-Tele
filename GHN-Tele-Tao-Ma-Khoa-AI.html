<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>GHN Tele · Tạo mã khóa AI</title>
<style>
:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
body { margin: 0; padding: 1.25rem; }
main { max-width: 32rem; margin: 1.5rem auto; }
h1 { font-size: 1.65rem; }
p { line-height: 1.5; }
label { display: block; margin: 1rem 0 .4rem; font-weight: 600; }
textarea, input, button { box-sizing: border-box; width: 100%; padding: .75rem; font: inherit; border-radius: .6rem; border: 1px solid gray; }
textarea { resize: vertical; overflow-wrap: anywhere; }
button { margin-top: .85rem; cursor: pointer; }
#make { background: #166849; color: white; border-color: #166849; font-weight: 700; }
#status { min-height: 1.4em; }
</style>
</head>
<body>
<main>
<h1>Tạo mã khóa AI</h1>
<p>Trang này tạo mã ngay trên thiết bị. Chỉ gửi mã <strong>GHNKEY1</strong> lại cho bot.</p>
<label for="pair">Mã ghép GHNPAIR1 từ bot</label>
<textarea id="pair" rows="3" autocomplete="off" spellcheck="false" autocapitalize="off"></textarea>
<label for="secret">Khóa API Claude hoặc Gemini</label>
<input type="password" id="secret" maxlength="256" autocomplete="off" spellcheck="false" autocapitalize="off">
<button id="make" type="button">Tạo mã để gửi bot</button>
<p id="status" role="status"></p>
<label for="result">Mã GHNKEY1</label>
<textarea id="result" rows="4" readonly></textarea>
<button id="copy" type="button">Sao chép mã</button>
</main>
<script>
"use strict";
const pair = document.getElementById("pair");
const secret = document.getElementById("secret");
const result = document.getElementById("result");
const status = document.getElementById("status");
const make = document.getElementById("make");
function fromBase64URL(raw) {
  const normalized = raw.replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(normalized + "=".repeat((4 - normalized.length % 4) % 4)), ch => ch.charCodeAt(0));
}
function toBase64URL(raw) {
  return btoa(String.fromCharCode(...new Uint8Array(raw))).replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
}
make.addEventListener("click", async () => {
  result.value = "";
  status.textContent = "";
  if (!globalThis.crypto?.subtle) {
    status.textContent = "Trình xem tệp này không hỗ trợ mã hóa. Hãy tải tệp về và mở bằng trình duyệt.";
    return;
  }
  const match = /^GHNPAIR1\.([A-Za-z0-9_-]{22})\.([A-Za-z0-9_-]{500,650})$/.exec(pair.value.trim());
  if (!match) {
    status.textContent = "Anh sao chép đầy đủ mã ghép GHNPAIR1 mới nhất từ bot nha.";
    return;
  }
  const input = secret.value.trim();
  if (!/^[A-Za-z0-9_.-]{20,256}$/.test(input)) {
    status.textContent = "Anh kiểm tra lại định dạng khóa API nha.";
    return;
  }
  make.disabled = true;
  const encoder = new TextEncoder();
  const plain = encoder.encode(input);
  try {
    const key = await crypto.subtle.importKey("spki", fromBase64URL(match[2]), {name: "RSA-OAEP", hash: "SHA-256"}, false, ["encrypt"]);
    const encrypted = await crypto.subtle.encrypt({name: "RSA-OAEP", label: encoder.encode("ghn-ai-key:" + match[1])}, key, plain);
    result.value = "GHNKEY1." + match[1] + "." + toBase64URL(encrypted);
    secret.value = "";
    status.textContent = "Đã tạo mã. Sao chép mã rồi gửi vào đúng chat riêng với bot.";
  } catch {
    status.textContent = "Chưa tạo được mã. Anh thử lấy mã ghép mới từ bot nha.";
  } finally {
    plain.fill(0);
    make.disabled = false;
  }
});
document.getElementById("copy").addEventListener("click", async () => {
  if (!result.value) return;
  try {
    await navigator.clipboard.writeText(result.value);
    status.textContent = "Đã sao chép mã GHNKEY1.";
  } catch {
    result.focus();
    result.select();
    status.textContent = "Anh giữ vào ô bên trên và chọn Sao chép nha.";
  }
});
</script>
</body>
</html>
